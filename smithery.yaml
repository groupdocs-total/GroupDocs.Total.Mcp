# Smithery registry manifest - https://smithery.ai
# Publishing is a manual step (see the improvement plan, task M8). DOCKER-FIRST product:
# there is no dnx/NuGet path (packed tool exceeds NuGet.org's 250 MB limit).
startCommand:
  type: stdio
  configSchema:
    type: object
    required: [storagePath]
    properties:
      storagePath:
        type: string
        title: Storage path
        description: Base folder for input and output files (mounted into the container at /data).
  commandFunction: |-
    (config) => ({
      command: "docker",
      args: ["run", "--rm", "-i", "-v", config.storagePath + ":/data", "ghcr.io/groupdocs-total/total-net-mcp:latest"]
    })
